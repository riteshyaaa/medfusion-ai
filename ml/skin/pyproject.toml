[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "medscope-skin-ml"
version = "0.1.0"
description = "Reproducible research training and evaluation for MedScope AI Skin Analysis"
requires-python = ">=3.10,<3.15"
dependencies = [
  "torch==2.14.1",
  "numpy==2.4.3",
  "Pillow==12.1.1",
  "scikit-learn==1.8.0",
  "matplotlib==3.10.8",
]

[project.scripts]
medscope-skin = "medscope_skin.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
