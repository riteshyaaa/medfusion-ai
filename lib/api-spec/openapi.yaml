  /cardiac/assessments/{id}/ai-explanations:
    get:
      operationId: listCardiacAiExplanations
      tags: [cardiac-assessments]
      summary: List consent-gated AI explanations for one saved cardiac assessment (owner-scoped)
      security:
        - cookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Explanations for the assessment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CardiacExplanationListResponse"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Assessment not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    post:
      operationId: createCardiacAiExplanation
      tags: [cardiac-assessments]
      summary: Generate an AI explanation of a saved cardiac research assessment (consent-gated)
      description: >
        Requires explicit per-request consent and the server-side external
        health-data transfer gate. Sends only the saved assessment's model
        inputs, model output, and documented limitations to the configured
        provider. The explanation never alters the score, threshold, label,
        or saved inputs; provider failures are explanation failures, not
        assessment failures. Comparison requests are refused across
        incompatible model versions or non-research statuses.
      security:
        - cookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCardiacExplanationRequest"
      responses:
        "201":
          description: Explanation created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CardiacExplanationResponse"
        "400":
          description: Missing consent, invalid comparison, or self-comparison
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: External health-data processing disabled by server configuration
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Assessment not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "502":
          description: Provider failure (recorded as a failed explanation; the assessment is unchanged)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: Provider not configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
