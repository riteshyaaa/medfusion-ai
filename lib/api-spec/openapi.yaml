          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DocumentFindingResponse"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Document or finding not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /documents/{id}/interpretations:
    post:
      operationId: interpretDocument
      tags: [documents]
      summary: Generate a consent-gated interpretation of confirmed findings
      description: Sends only structured findings (corrected values take precedence) to the configured provider. Requires explicit consent plus server-side external processing gates. Provider output is validated against safety rules and rejected output is never stored.
      security:
        - cookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InterpretDocumentRequest"
      responses:
        "201":
          description: Interpretation stored
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DocumentInterpretationResponse"
        "400":
          description: Consent missing
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Document is not eligible or has no findings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          description: Provider rate limited
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "502":
          description: Provider output failed safety validation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: Provider unavailable or external processing disabled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /cardiac/model-status:
    get:
      operationId: getCardiacModelStatus
      tags: [cardiac]
      summary: Cardiac model availability and feature contract
      description: Returns the required input feature contract and whether an approved cardiac model artifact is available for inference.
      responses:
        "200":
          description: Cardiac model status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CardiacModelStatus"
  /cardiac/assessments:
    get:
      operationId: listCardiacAssessments
      tags: [cardiac-assessments]
      summary: List persisted cardiac assessments (owner-scoped)
      security:
        - cookieAuth: []
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
            maximum: 100
        - name: caseId
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: Paginated cardiac assessments
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CardiacAssessmentListResponse"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    post:
      operationId: createCardiacAssessment
      tags: [cardiac-assessments]
      summary: Run the research-only cardiac baseline and persist the assessment
      description: >
        Scores must come from the checksum-verified research bundle. Scores are
        uncalibrated logistic outputs, never clinical probabilities. Reuse of
        contract feature names and categories is required.
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCardiacAssessmentRequest"
      responses:
        "201":
          description: Cardiac assessment created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CardiacAssessmentResponse"
        "400":
          description: Invalid request body or unsupported feature value
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Case not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /cardiac/assessments/{id}:
    get:
      operationId: getCardiacAssessment
      tags: [cardiac-assessments]
      summary: Get one persisted cardiac assessment
      security:
        - cookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Cardiac assessment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CardiacAssessmentResponse"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Assessment not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /symptoms/follow-up-questions:
    get:
      operationId: listSymptomFollowUpQuestions
      tags: [symptoms]
      summary: Curated follow-up questions applicable to the reported pattern
      description: >
        Deterministically selects questions from the versioned curated
        catalogue based on the chosen category, primary symptom text, and
        catalogue symptom ids. Questions are educational intake aids; answers
        feed the deterministic safety rules, which always outrank the AI.
      security:
        - cookieAuth: []
      parameters:
        - name: category
          in: query
          schema:
            type: string
            enum: [skin, general, neurological, cardiovascular, respiratory, gastrointestinal, musculoskeletal, psychiatric, other]
            default: general
        - name: primary
          in: query
          description: Primary symptom free text used for topic matching
          schema:
            type: string
            maxLength: 1000
        - name: symptoms
          in: query
          description: Comma-separated catalogue symptom ids
          schema:
            type: string
            maxLength: 4000
      responses:
        "200":
          description: Applicable follow-up questions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SymptomFollowUpQuestionsResponse"
        "400":
          description: Invalid parameters
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /symptoms/classifier-status:
    get:
      operationId: getSymptomClassifierStatus
      tags: [symptoms]
      summary: Symptom classifier availability, catalogue, and provenance
      description: >
        Reports whether the checksum-verified research-only symptom classifier is
        installed and returns the curated symptom vocabulary for building the
        multi-select interface. Scores from this classifier are uncalibrated
        posteriors and must never be presented as diagnoses.
      responses:
        "200":
          description: Symptom classifier status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SymptomClassifierStatus"
  /skin/model-status:
    get:
      operationId: getSkinModelStatus
      tags: [skin]
      summary: Skin model availability and mode
      description: >
        Reports whether a checksum-verified skin model artifact is installed and
        which serving mode applies. Research-only artifacts stay clearly labelled:
        their scores are raw model outputs, not clinically validated results.
      responses:
        "200":
          description: Skin model status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SkinInferenceStatus"
  /cases/{id}/workspace:
    get:
      operationId: getCaseWorkspace
      tags: [cases]
      summary: Consolidated workspace for a case
      description: Returns the case with its uploads, model outputs, documents, symptom assessments, and reports. Outputs from different models are listed side by side, never merged into one score.
      security:
        - cookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Case workspace
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CaseWorkspaceResponse"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Case not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /reports/{id}/export:
    get:
      operationId: exportReport
      tags: [reports]
      summary: Export a draft report as plain text
      security:
        - cookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Plain text report export
          content:
            text/plain:
              schema:
                type: string
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Report not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: session_id
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    ReadinessStatus:
      type: object
      properties:
        status:
          type: string
          enum: [ready, not_ready]
        checks:
          type: object
          properties:
            database:
              type: boolean
            model:
              type: boolean
            cardiacModel:
              type: boolean
            skinInference:
              type: object
              properties:
                available:
                  type: boolean
                status:
                  type: string
                  enum: [unavailable]
                reason:
                  type: string
                mode:
                  type: string
                  nullable: true
                  enum: [research_only, approved]
                modelId:
                  type: string
                  nullable: true
                modelVersion:
                  type: string
                  nullable: true
                readinessState:
                  type: string
                  nullable: true
                calibrationStatus:
                  type: string
                  nullable: true
                labels:
                  type: array
                  nullable: true
                  items:
                    type: string
                readinessNote:
                  type: string
                  nullable: true
              required: [available]
            cardiacInference:
              type: object
              properties:
                available:
                  type: boolean
                status:
                  type: string
                  nullable: true
                  enum: [model_unavailable]
                reason:
                  type: string
                  nullable: true
                mode:
                  type: string
                  nullable: true
                  enum: [research_only]
                modelId:
                  type: string
                  nullable: true
                modelVersion:
                  type: string
                  nullable: true
                calibrationStatus:
                  type: string
                  nullable: true
              required: [available]
            symptomClassifier:
              type: object
              properties:
                available:
                  type: boolean
                mode:
                  type: string
                  nullable: true
                  enum: [research_only]
                modelId:
                  type: string
                  nullable: true
                modelVersion:
                  type: string
                  nullable: true
                classCount:
                  type: integer
                  nullable: true
                status:
                  type: string
                  nullable: true
                  enum: [unavailable]
                reason:
                  type: string
                  nullable: true
              required: [available]
            aiProvider:
              type: string
              enum: [disabled, unconfigured, misconfigured, configured]
            documentOcr:
              type: object
              properties:
                status:
                  type: string
                  enum: [disabled, configured]
                providerId:
                  type: string
                reason:
                  type: string
      required:
        - status
        - checks
    RegisterRequest:
      type: object
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 10
          maxLength: 200
        fullName:
          type: string
      required:
        - email
        - password
    LoginRequest:
      type: object
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          maxLength: 200
      required:
        - email
        - password
    AuthResponse:
      type: object
      properties:
        user:
          $ref: "#/components/schemas/User"
      required:
        - user
    LogoutResult:
      type: object
      properties:
        message:
          type: string
      required:
        - message
    User:
      type: object
      properties:
        id:
          type: integer
        email:
          type: string
        fullName:
          type: string
        role:
          type: string
          enum: [user, clinician, admin]
        createdAt:
          type: string
      required:
        - id
        - email
        - role
        - createdAt
    UserResponse:
      type: object
      properties:
        user:
          $ref: "#/components/schemas/User"
      required:
        - user
    UploadRequest:
      type: object
      properties:
        file:
          type: string
          format: binary
        caseId:
          type: integer
      required:
        - file
    UploadResponse:
      type: object
      properties:
        upload:
          $ref: "#/components/schemas/Upload"
      required:
        - upload
    Upload:
      type: object
      properties:
        id:
          type: integer
        caseId:
          type: integer
          nullable: true
        originalFileName:
          type: string
        mimeType:
          type: string
        sizeBytes:
          type: integer
        width:
          type: integer
        height:
          type: integer
        createdAt:
          type: string
      required:
        - id
        - originalFileName
        - mimeType
        - sizeBytes
        - createdAt
    PredictRequest:
      type: object
      properties:
        uploadId:
          type: integer
          minimum: 1
          description: ID returned by POST /uploads, scoped to the current user
        consentToExternalProcessing:
          type: boolean
          description: When true and the AI provider is configured, the image is analyzed by the external AI model under the operator transfer gates and this explicit consent.
      required:
        - uploadId
    PredictionResult:
      type: object
      properties:
        id:
          type: integer
        disease:
          type: string
        confidence:
          type: number
        description:
          type: string
        severity:
          type: string
          enum: [unassessed, mild, moderate, severe, normal]
        recommendations:
          type: array
          items:
            type: string
        differentialDiagnoses:
          type: array
          items:
            $ref: "#/components/schemas/DifferentialDiagnosis"
        preprocessingSteps:
          type: array
          items:
            type: string
        modelId:
          type: string
          nullable: true
        modelVersion:
          type: string
          nullable: true
        scoreSemantics:
          type: string
          enum: [simulated, raw_model_score, calibrated_probability, unverified]
        preprocessingVersion:
          type: string
          nullable: true
        aiAssessment:
          nullable: true
          type: object
          properties:
            provider:
              type: string
            model:
              type: string
            imageType:
              type: string
              enum: [real_skin, not_skin, unclear]
            visibleAbnormality:
              type: boolean
            description:
              type: string
            observations:
              type: array
              items:
                type: string
            possibleConditions:
              type: array
              items:
                type: object
                properties:
                  name:
                    type: string
                  reason:
                    type: string
                required: [name, reason]
            uncertainty:
              type: string
            severity:
              type: string
            urgency:
              type: string
            nextSteps:
              type: array
              items:
                type: string
            consultClinicianWhen:
              type: array
              items:
