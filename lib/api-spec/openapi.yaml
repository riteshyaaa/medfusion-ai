openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
  description: Skin Disease Detection AI API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: predictions
    description: Skin disease prediction operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /predict:
    post:
      operationId: predictSkinDisease
      tags: [predictions]
      summary: Predict skin disease from image
      description: Analyzes uploaded skin image and returns disease prediction with confidence score
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PredictRequest"
      responses:
        "200":
          description: Prediction result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PredictionResult"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /predictions:
    get:
      operationId: getPredictionHistory
      tags: [predictions]
      summary: Get prediction history
      description: Returns list of past skin disease predictions
      responses:
        "200":
          description: List of past predictions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PredictionHistoryResponse"

  /predictions/{id}:
    get:
      operationId: getPredictionById
      tags: [predictions]
      summary: Get prediction by ID
      description: Returns a specific prediction by its ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Prediction details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PredictionRecord"
        "404":
          description: Prediction not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    PredictRequest:
      type: object
      properties:
        imageBase64:
          type: string
          description: Base64 encoded image data
        imageUrl:
          type: string
          description: URL of the image to analyze (optional alternative to base64)
        fileName:
          type: string
          description: Original filename of the uploaded image
      required:
        - imageBase64

    PredictionResult:
      type: object
      properties:
        id:
          type: integer
        disease:
          type: string
          description: Predicted skin disease name
        confidence:
          type: number
          description: Confidence score between 0 and 1
        description:
          type: string
          description: Brief description of the predicted condition
        severity:
          type: string
          enum: [mild, moderate, severe, normal]
          description: Severity level of the predicted condition
        recommendations:
          type: array
          items:
            type: string
          description: List of treatment/care recommendations
        differentialDiagnoses:
          type: array
          items:
            $ref: "#/components/schemas/DifferentialDiagnosis"
          description: Other possible diagnoses with lower confidence
        preprocessingSteps:
          type: array
          items:
            type: string
          description: Image preprocessing steps applied
        createdAt:
          type: string
          description: ISO timestamp of prediction
      required:
        - id
        - disease
        - confidence
        - description
        - severity
        - recommendations
        - differentialDiagnoses
        - preprocessingSteps
        - createdAt

    DifferentialDiagnosis:
      type: object
      properties:
        disease:
          type: string
        confidence:
          type: number
      required:
        - disease
        - confidence

    PredictionRecord:
      type: object
      properties:
        id:
          type: integer
        disease:
          type: string
        confidence:
          type: number
        description:
          type: string
        severity:
          type: string
        recommendations:
          type: array
          items:
            type: string
        differentialDiagnoses:
          type: array
          items:
            $ref: "#/components/schemas/DifferentialDiagnosis"
        preprocessingSteps:
          type: array
          items:
            type: string
        imageBase64:
          type: string
        fileName:
          type: string
        createdAt:
          type: string
      required:
        - id
        - disease
        - confidence
        - description
        - severity
        - recommendations
        - differentialDiagnoses
        - preprocessingSteps
        - createdAt

    PredictionHistoryResponse:
      type: object
      properties:
        predictions:
          type: array
          items:
            $ref: "#/components/schemas/PredictionRecord"
        total:
          type: integer
      required:
        - predictions
        - total

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
        message:
          type: string
      required:
        - error
        - message
