            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /documents/{id}/reprocess:
    post:
      operationId: reprocessDocument
      tags: [documents]
      summary: Re-run extraction for a document
      description: Clears prior extracted findings and re-runs text extraction or OCR.
      security:
        - cookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
