            modelBoundaries:
              type: string
            missingInformation:
              type: string
            comparisonContext:
              type: string
            questionsForProvider:
              type: array
              items:
                type: string
        status:
          type: string
          enum: [completed, failed]
        errorCode:
          type: string
          nullable: true
        createdAt:
          type: string
      required: [id, assessmentId, provider, model, promptVersion, status, createdAt]
