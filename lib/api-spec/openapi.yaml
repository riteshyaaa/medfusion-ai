    CreateCardiacAssessmentRequest:
      type: object
      properties:
        caseId:
          type: integer
        age:
          type: number
          minimum: 18
          maximum: 120
        sex:
          type: string
          enum: [male, female]
        chestPainType:
          type: string
          enum: [typical_angina, atypical_angina, non_anginal, asymptomatic]
        restingBloodPressure:
          type: number
          minimum: 60
          maximum: 250
        serumCholesterol:
          type: number
          minimum: 50
          maximum: 700
        fastingBloodSugarOver120:
          type: string
          enum: [yes, no]
        restingEcg:
          type: string
          enum: [normal, st_t_abnormality, left_ventricular_hypertrophy]
        maxHeartRate:
          type: number
          minimum: 50
          maximum: 250
        exerciseAngina:
          type: string
          enum: [yes, no]
        stDepression:
          type: number
          minimum: 0
          maximum: 10
        stSlope:
          type: string
          enum: [upsloping, flat, downsloping]
        majorVessels:
          type: number
          minimum: 0
          maximum: 3
        thalassemia:
          type: string
          enum: [normal, fixed_defect, reversible_defect]
        currentSymptoms:
          type: array
          items:
            type: string
            enum: [current_chest_pain, severe_shortness_of_breath, fainting, stroke_signs, uncontrolled_bleeding, severe_allergic_reaction]
          maxItems: 6
          default: []
          description: Urgent-symptom screening selections; positive urgent selections bypass the model entirely.
        measurementSource:
          type: string
          enum: [self_measured, patient_reported, imported_history, unspecified]
          default: unspecified
          description: Provenance of the entered values as recorded by the user.
        contextualFactors:
          type: array
          maxItems: 12
          items:
            $ref: "#/components/schemas/CardiacContextualFactor"
          default: []
          description: Contextual cardiovascular history that is stored for the record but is NOT consumed by the current research model.
      required: [age, sex, chestPainType, restingBloodPressure, serumCholesterol, fastingBloodSugarOver120, restingEcg, maxHeartRate, exerciseAngina, stDepression, stSlope, majorVessels, thalassemia]
