  /documents/{id}/interpretations:
    post:
      operationId: interpretDocument
      tags: [documents]
      summary: Generate a consent-gated interpretation of confirmed findings
      description: Sends only structured findings (corrected values take precedence) to the configured provider. For narrative documents without structured findings, the extracted plain text is sent instead once its reviewed status gate passes. Requires explicit consent plus server-side external processing gates. Provider output is validated against safety rules; failed attempts are recorded with an error code so users can see and retry them, and rejected provider output itself is never stored.
      security:
        - cookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InterpretDocumentRequest"
      responses:
        "201":
          description: Interpretation stored
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DocumentInterpretationResponse"
        "400":
          description: Consent missing
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Document is not eligible or has no findings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          description: Provider rate limited
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "502":
          description: Provider output failed safety validation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: Provider unavailable or external processing disabled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
